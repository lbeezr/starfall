name: Starfall simulator

# Automatic validation is restricted below to public lbeezr/starfall main.
# No pull_request or schedule triggers; unrelated documentation pushes are ignored.
on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'AppTests/**'
      - 'Config/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Starfall.xcodeproj/**'
      - 'scripts/ci-*'
      - 'scripts/device-update.py'
      - 'scripts/build_identity.py'
      - 'scripts/test_device_update.py'
      - 'scripts/native_test_plan.py'
      - 'scripts/test_native_test_plan.py'
      - 'scripts/rc-platforms.py'
      - 'scripts/test_rc_platforms.py'
      - 'scripts/simulator-command.py'
      - 'scripts/simulator-lifecycle.sh'
      - 'scripts/test_simulator_lifecycle.py'
      - 'scripts/export_native_evidence.py'
      - 'scripts/test_export_native_evidence.py'
      - '.github/workflows/starfall-simulator.yml'
  workflow_dispatch:
    inputs:
      budget_confirmed:
        description: 'I verified included Actions allowance or approved this run’s cost'
        type: boolean
        required: true
        default: false

      acceptance_stage:
        description: 'Development or full RC matrix (requires installed iOS 17 and iPad simulators)'
        type: choice
        options: [dev, rc]
        default: dev

permissions:
  contents: read

concurrency:
  group: starfall-simulator
  cancel-in-progress: true

jobs:
  native-smoke:
    # Forks never run this job. Private pushes never run it. Manual runs still
    # require an explicit budget acknowledgement even in the intended repo.
    if: >-
      ${{ github.repository == 'lbeezr/starfall' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            github.event.repository.private == false) ||
           (github.event_name == 'workflow_dispatch' && inputs.budget_confirmed == true)) }}
    # Xcode 26.4+ fixes a simdiskimaged hang; macOS 15 tops out at 26.3.
    # Keep the standard ARM64 runner and the bounded inventory command.
    runs-on: macos-26
    # 29 passing UI cases took 20.5 minutes in run 39201250877; the development
    # plan now selects 120, followed by hosted tests. Preserve per-test bounds.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify update decisions and development/RC matrix
        run: |
          python3 scripts/test_device_update.py
          python3 scripts/test_native_test_plan.py
          python3 scripts/test_rc_platforms.py
          python3 scripts/test_simulator_lifecycle.py
          python3 scripts/test_export_native_evidence.py
      - name: Build, test core, and capture one iPhone simulator
        env:
          STARFALL_ACCEPTANCE_STAGE: ${{ inputs.acceptance_stage || 'dev' }}
        run: bash scripts/ci-simulator.sh
      - name: Upload compact source-bound evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starfall-simulator-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn
          include-hidden-files: false

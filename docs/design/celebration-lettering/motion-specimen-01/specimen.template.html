<div id="crystal-motion-study">
  <style>
    #crystal-motion-study .study-panels { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin:18px 0; }
    #crystal-motion-study .study-panel { min-width:0; }
    #crystal-motion-study .study-panel h3 { margin:0 0 8px; }
    #crystal-motion-study canvas { display:block; width:100%; aspect-ratio:1.38; border-radius:14px; }
    #crystal-motion-study .study-caption { margin-top:8px; }
    #crystal-motion-study .angle-control { flex:1 1 220px; max-width:340px; }
    #crystal-motion-study .study-toolbar { padding-right:92px; }
    #crystal-motion-study[data-size="detail"] .study-panels { grid-template-columns:minmax(0,1fr); }
    #crystal-motion-study[data-size="detail"] canvas { aspect-ratio:2.2; }
    #crystal-motion-study output { display:inline-block; min-width:4ch; }
    @media(max-width:580px) { #crystal-motion-study .study-panels { grid-template-columns:minmax(0,1fr); } #crystal-motion-study .study-toolbar { padding-right:0; } }
  </style>
  <div class="viz-controls study-toolbar">
    <button class="btn btn-primary" type="button" data-action="play">Pause</button>
    <button class="btn" type="button" data-action="replay">Replay</button>
    <label class="form-label">Scale
      <select class="form-select" data-control="size"><option value="phone">Phone</option><option value="detail">Detail</option></select>
    </label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="slow"><span class="form-check-label">Slow motion</span></label>
  </div>
  <div class="study-panels">
    <section class="study-panel">
      <h3>Flat tilt</h3>
      <canvas data-view="flat" role="img" aria-label="Relay! plus 128. Flat illustrated letters tilted as individual cards.">Relay! +128 — flat illustrated letters.</canvas>
      <div class="text-small study-caption">One illustrated face per character</div>
    </section>
    <section class="study-panel">
      <h3>Crystal depth</h3>
      <canvas data-view="depth" role="img" aria-label="Relay! plus 128. The same illustrated faces with shallow crystal edges visible as they turn.">Relay! +128 — illustrated faces with shallow crystal edges.</canvas>
      <div class="text-small study-caption">Same faces · turning reveals crystal edges</div>
    </section>
  </div>
  <div class="viz-controls">
    <label class="form-label angle-control">Inspect turn <output class="tabular-nums" data-value="angle">0°</output>
      <input class="form-range" data-control="angle" type="range" min="-35" max="35" step="1" value="0" aria-label="Inspect letter turn in degrees">
    </label>
    <span class="text-small" data-value="status" role="status" aria-live="polite">Loading specimen</span>
  </div>
  <div class="text-small">Motion concept · shared artwork and timing · not an in-game capture</div>
  <script>
  (() => {
    const root = document.getElementById('crystal-motion-study');
    const geometry = __GEOMETRY__;
    const atlas = new Image();
    const byCharacter = new Map();
    const canvases = [...root.querySelectorAll('canvas')];
    const button = root.querySelector('[data-action="play"]');
    const replay = root.querySelector('[data-action="replay"]');
    const angleInput = root.querySelector('[data-control="angle"]');
    const angleOutput = root.querySelector('[data-value="angle"]');
    const sizeInput = root.querySelector('[data-control="size"]');
    const slowInput = root.querySelector('[data-control="slow"]');
    const status = root.querySelector('[data-value="status"]');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    const duration = 6200;
    let ready = false, playing = !motionPreference.matches, elapsed = motionPreference.matches ? duration : 0;
    let manual = false, angle = 0, raf = 0, last = 0;
    const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
    const ease = t => 1 - Math.pow(1-clamp(t,0,1),3);
    const rad = Math.PI / 180;
    const transform = (p,yaw,pitch,roll) => {
      const cy=Math.cos(yaw), sy=Math.sin(yaw), cx=Math.cos(pitch), sx=Math.sin(pitch), cz=Math.cos(roll), sz=Math.sin(roll);
      const x=p[0]*cy+p[2]*sy, z=-p[0]*sy+p[2]*cy, y=p[1]*cx-z*sx, zz=p[1]*sx+z*cx;
      return [x*cz-y*sz,x*sz+y*cz,zz];
    };
    function normal(a,b,c) {
      const u=b.map((v,i)=>v-a[i]), v=c.map((q,i)=>q-a[i]);
      const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
      const length=Math.hypot(...n)||1; return n.map(x=>x/length);
    }
    function makeGlyph(g) {
      const [, ,w,h]=g.rect, face=document.createElement('canvas'); face.width=w; face.height=h;
      const ctx=face.getContext('2d'), clip=new Path2D();
      for(const loop of g.contours) { loop.forEach(([x,y],i)=>i?clip.lineTo(x,y):clip.moveTo(x,y)); clip.closePath(); }
      ctx.clip(clip,'evenodd'); ctx.drawImage(atlas,...g.rect,0,0,w,h);
      return {...g,face};
    }
    function edges(g,depth) {
      const w=g.rect[2],h=g.rect[3],facets=[];
      for(const loop of g.contours) {
        for(let i=0;i<loop.length;i++) {
          const a=loop[i], b=loop[(i+1)%loop.length], dx=b[0]-a[0],dy=b[1]-a[1], length=Math.hypot(dx,dy);
          if(length<1)continue;
          const nx=dy/length,ny=-dx/length;
          const frontA=[a[0]-w/2,a[1]-h/2,0],frontB=[b[0]-w/2,b[1]-h/2,0];
          const midA=[frontA[0]+nx*1.1,frontA[1]+ny*1.1,-depth*.22];
          const midB=[frontB[0]+nx*1.1,frontB[1]+ny*1.1,-depth*.22];
          const backA=[frontA[0]-nx*.9,frontA[1]-ny*.9,-depth],backB=[frontB[0]-nx*.9,frontB[1]-ny*.9,-depth];
          facets.push({points:[frontA,midA,midB,frontB],bevel:true,phase:(a[0]+a[1])*.015});
          const center=midA.map((v,j)=>(v+midB[j]+backA[j]+backB[j])/4);
          for(const [p,q] of [[midA,backA],[backA,backB],[backB,midB],[midB,midA]]) facets.push({points:[p,q,center],bevel:false,phase:(a[0]+a[1])*.015});
        }
      }
      return facets;
    }
    function drawGlyph(ctx,g,x,y,scale,yaw,pitch,roll,withDepth,opacity) {
      if(opacity<=0)return;
      const w=g.rect[2],h=g.rect[3];
      ctx.save();ctx.globalAlpha=opacity;ctx.translate(x,y);ctx.scale(scale,scale);
      if(withDepth) {
        const visible=[];
        for(const facet of g.facets) {
          const points=facet.points.map(p=>transform(p,yaw,pitch,roll));
          const n=normal(points[0],points[1],points[2]);
          if(n[2]<=0.001)continue;
          visible.push({...facet,points,n,z:points.reduce((s,p)=>s+p[2],0)/points.length});
        }
        visible.sort((a,b)=>a.z-b.z);
        for(const f of visible) {
          const light=clamp(.38+Math.max(0,-.35*f.n[0]-.45*f.n[1]+.82*f.n[2])*.66,.28,1.1);
          const hue=242+Math.sin(f.phase)*32, saturation=f.bevel?67:56, luminosity=clamp((f.bevel?72:58)*light,25,86);
          ctx.fillStyle=`hsl(${hue} ${saturation}% ${luminosity}%)`;
          ctx.beginPath();f.points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
        }
      }
      const origin=transform([-w/2,-h/2,0],yaw,pitch,roll),axisX=transform([1,0,0],yaw,pitch,roll),axisY=transform([0,1,0],yaw,pitch,roll);
      ctx.transform(axisX[0],axisX[1],axisY[0],axisY[1],origin[0],origin[1]);ctx.drawImage(g.face,0,0);ctx.restore();
    }
    function pose(t,index) {
      if(manual)return {yaw:angle*rad,pitch:-7*rad,roll:0,lift:0,alpha:1,scale:1};
      const entry=clamp((t-index*42)/650,0,1),e=ease(entry);
      const turn= t<1550 ? -30*(1-e) : t<5400 ? 30*Math.sin((t-1550)/(5400-1550)*Math.PI*2) : 0;
      return {yaw:turn*rad,pitch:-7*rad*Math.min(1,Math.abs(turn)/15),roll:(index%2?1:-1)*8*rad*(1-e),lift:(1-e)*18,alpha:clamp(entry*3,0,1),scale:.88+.12*e};
    }
    function drawRow(ctx,text,heights,baseY,desiredWidth,canvasWidth,depth,time) {
      const specs=[...text].map((c,i)=>{const g=byCharacter.get(c),height=heights[i];return {g,height,width:g.rect[2]/g.rect[3]*height};});
      const gap=text==='Relay!'?3.5:5.2,total=specs.reduce((s,g)=>s+g.width,0)+gap*(specs.length-1),s=desiredWidth/total;
      let cursor=(canvasWidth-desiredWidth)/2;
      specs.forEach((item,i)=>{
        const p=pose(time,i+(text==='Relay!'?0:2));
        const descender=text==='Relay!'&&i===4?21*s:0;
        drawGlyph(ctx,item.g,cursor+item.width*s/2,baseY-item.height*s/2+descender+p.lift,item.height/item.g.rect[3]*s*p.scale,p.yaw,p.pitch,p.roll,depth,p.alpha);
        cursor+=(item.width+gap)*s;
      });
    }
    function render() {
      if(!ready)return;
      for(const canvas of canvases) {
        const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
        const width=box.width,height=box.height;
        if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(height*dpr)){canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);}
        const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
        // Fixed moonlit product backdrop, shared by both material samples.
        const background=ctx.createRadialGradient(width*.5,height*.43,0,width*.5,height*.43,width*.7);
        background.addColorStop(0,'#29223f');background.addColorStop(1,'#0c1027');ctx.fillStyle=background;ctx.fillRect(0,0,width,height);
        const detail=sizeInput.value==='detail',titleWidth=Math.min(width-40,detail?510:280,height*1.42), depth=canvas.dataset.view==='depth';
        const titleY=height*.48,scoreY=height*.82;
        drawRow(ctx,'Relay!',[100,74,104,74,102,96],titleY,titleWidth,width,depth,elapsed);
        drawRow(ctx,'+128',[78,100,100,100],scoreY,titleWidth*.56,width,depth,elapsed);
      }
      const degrees=manual?angle:pose(elapsed,0).yaw/rad;
      angleOutput.value=`${Math.round(degrees)}°`;
      if(!manual)angleInput.value=String(Math.round(degrees));
      root.dataset.ready='true';root.dataset.playing=String(playing);root.dataset.elapsed=String(Math.round(elapsed));
    }
    function updateStatus(message) {status.textContent=message;button.textContent=playing?'Pause':elapsed>=duration||manual?'Play':'Resume';}
    function frame(now) {
      raf=0;if(!playing||!ready||document.hidden)return;
      if(last)elapsed+=Math.min(now-last,80)/(slowInput.checked?2.5:1);last=now;
      if(elapsed>=duration){elapsed=duration;playing=false;updateStatus('Settled');}
      render();if(playing)raf=requestAnimationFrame(frame);
    }
    function start() {if(!ready)return;manual=false;playing=true;last=0;updateStatus('Playing');cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
    function stop(message) {playing=false;cancelAnimationFrame(raf);raf=0;last=0;updateStatus(message);render();}
    function saveState() {
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{specimen:'Relay! +128',scale:sizeInput.value,inspectedAngle:manual?angle:null,slowMotion:slowInput.checked},privateContent:null}).catch(()=>{});
    }
    function applyState(state) {
      const saved=state?.modelContent;if(!saved||saved.specimen!=='Relay! +128')return;
      sizeInput.value=saved.scale==='detail'?'detail':'phone';root.dataset.size=sizeInput.value;
      slowInput.checked=saved.slowMotion===true;
      if(Number.isFinite(saved.inspectedAngle)){manual=true;angle=clamp(saved.inspectedAngle,-35,35);angleInput.value=String(angle);elapsed=duration;playing=false;}
      render();
    }
    button.addEventListener('click',()=>{if(playing)stop('Paused');else{if(manual||elapsed>=duration)elapsed=0;start();}});
    replay.addEventListener('click',()=>{elapsed=0;start();});
    angleInput.addEventListener('input',()=>{manual=true;angle=Number(angleInput.value);elapsed=duration;stop('Inspecting angle');saveState();});
    sizeInput.addEventListener('change',()=>{root.dataset.size=sizeInput.value;render();saveState();});
    slowInput.addEventListener('change',saveState);
    motionPreference.addEventListener('change',e=>{if(e.matches){manual=false;elapsed=duration;stop('Reduced motion · static view');}});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('Paused');});
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)applyState(event.detail.globals.widgetState);});
    new ResizeObserver(render).observe(root);
    applyState(window.openai?.widgetState);
    atlas.onload=()=>{
      for(const g of geometry.glyphs){const glyph=makeGlyph(g);glyph.facets=edges(g,g.rect[3]*.18);byCharacter.set(g.character,glyph);}
      ready=true;render();if(playing)start();else updateStatus(motionPreference.matches?'Reduced motion · static view':'Inspecting angle');
    };
    atlas.onerror=()=>{playing=false;status.textContent='Artwork could not load';status.setAttribute('role','alert');button.disabled=true;replay.disabled=true;};
    atlas.src='__ATLAS__';
  })();
  </script>
</div>

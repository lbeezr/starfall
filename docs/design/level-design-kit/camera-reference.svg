<text x="64" y="828" class="mono">u = u₀ + sX</text>
<text x="64" y="860" class="mono">v = v₀ − s(Y sin 55° + Z cos 55°)</text>
<text x="64" y="907" class="small muted">Authored measuring plate — not a camera calibration</text>
<text x="64" y="932" class="small muted">of Blizzard or the approved Starfall paintings.</text>
<line x1="615" y1="812" x2="615" y2="932" stroke="#42526d"/>
<text x="641" y="828" class="body">Lock camera + framing within each five-state family.</text>
<text x="641" y="860" class="body">Recompose the world for each format; preserve its vantage.</text>
<text x="641" y="892" class="body">Native stars stay screen-facing; the board never becomes a diamond.</text>
<text x="641" y="928" class="small muted">Use separate native-layout guides for crop, contrast and UI clearance.</text>

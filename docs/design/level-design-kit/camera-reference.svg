<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Starfall camera construction reference — working construction v1</title>
<desc id="desc">An authored orthographic camera at 55 degrees above horizontal, with yaw and roll zero. Left: a square floor projects to a rectangle with depth ratio 0.819, and a circular pool projects to an ellipse of the same ratio. Middle: a thick platform, upright arch and stairs use one camera; the assembly is turned 15 degrees locally to expose a side face. Right: a side elevation shows the 55-degree view. This technical reference is not a measured reconstruction of existing paintings or game UI.</desc>
